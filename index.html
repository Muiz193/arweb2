<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AR Video Player</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Hide scanning UI */
      .matrix-ctrl, .prompt-msg { display: none !important; }
      
      /* BUTTON STYLE */
      .nav-button {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        padding: 10px 20px;
        background-color: white;
        border: 2px solid #333;
        border-radius: 8px;
        font-family: sans-serif;
        font-weight: bold;
        text-decoration: none;
        color: black;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
    </style>

    <script>
      // *** SIMPLE COMPONENT TO SYNC VIDEO & AUDIO ***
      AFRAME.registerComponent('sync-media-on-target', {
        init: function() {
          const target = this.el;
          const video = document.querySelector("#ar-video");
          const audio = document.querySelector("#ar-audio");

          // 1. Play both when Target is Found
          target.addEventListener("targetFound", () => {
            console.log("Target Found: Playing Media");
            if(video) video.play();
            if(audio) audio.play();
          });

          // 2. Pause both when Target is Lost
          target.addEventListener("targetLost", () => {
            console.log("Target Lost: Pausing Media");
            if(video) video.pause();
            if(audio) audio.pause();
          });

          // 3. Click Fallback (For browsers that block auto-audio)
          document.body.addEventListener('click', () => {
            if(video && video.paused) video.play();
            if(audio && audio.paused) audio.play();
          });
        }
      });
    </script>
  </head>
  <body>

    <a href="./index.html" class="nav-button">View 3D Model 🧊</a>

    <a-scene 
      mindar-image="imageTargetSrc: ./newtarget.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="ar-video" src="./video.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" muted></video>
        
        <audio id="ar-audio" src="./animationaudiolatest.ogg" preload="auto" loop="true"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" sync-media-on-target>
          
          <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
          
      </a-entity>

    </a-scene>
  </body>
</html>
