<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AR Video Player</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      .matrix-ctrl, .prompt-msg { display: none !important; }
      
      .nav-button {
        position: absolute; top: 20px; right: 20px; z-index: 1000;
        padding: 10px 20px; background-color: white; border: 2px solid #333;
        border-radius: 8px; font-family: sans-serif; font-weight: bold;
        text-decoration: none; color: black; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
    </style>

    <script>
      // *** 1. ZOOM FEATURE (Pinch to Scale) ***
      AFRAME.registerComponent('zoom-handler', {
        init: function () {
          this.startScale = 1.0; 
          this.isPinching = false;
          
          // Mouse Wheel (Desktop)
          document.body.addEventListener('wheel', (e) => {
            const currentScale = this.el.object3D.scale.x;
            let newScale = currentScale + (e.deltaY * -0.005);
            newScale = Math.min(Math.max(newScale, 0.5), 5.0); // Limit size
            this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
          });

          // Touch (Mobile)
          document.body.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
              this.isPinching = true;
              this.startDistance = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
              );
              this.startScale = this.el.object3D.scale.x;
            }
          });

          document.body.addEventListener('touchmove', (e) => {
            if (this.isPinching && e.touches.length === 2) {
              const newDistance = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
              );
              const scaleFactor = newDistance / this.startDistance;
              let newScale = this.startScale * scaleFactor;
              newScale = Math.min(Math.max(newScale, 0.5), 5.0); // Limit size
              this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
            }
          });

          document.body.addEventListener('touchend', () => { this.isPinching = false; });
        }
      });
    </script>

    <script>
      // *** 2. DELAY & PLAY LOGIC ***
      AFRAME.registerComponent('delayed-play', {
        init: function() {
          const target = this.el;
          const video = document.querySelector("#ar-video");
          const audio = document.querySelector("#ar-audio");
          
          let timer = null;

          // PLAY function
          const triggerPlay = () => {
             // Wait 0.2 seconds (200ms)
             timer = setTimeout(() => {
                 if(video && video.paused) video.play();
                 if(audio && audio.paused) {
                     audio.volume = 0.5;
                     audio.play();
                 }
             }, 1200); 
          };

          // PAUSE function
          const triggerPause = () => {
             clearTimeout(timer); // Cancel delay if lost quickly
             if(video) video.pause();
             if(audio) audio.pause();
          };

          target.addEventListener("targetFound", triggerPlay);
          target.addEventListener("targetLost", triggerPause);

          // Click Fallback (in case browser blocks audio)
          document.body.addEventListener('click', () => {
             if(video && video.paused) video.play();
             if(audio && audio.paused) audio.play();
          });
        }
      });
    </script>
  </head>
  <body>

    <a href="./index.html" class="nav-button">View 3D Model </a>

    <a-scene 
      mindar-image="imageTargetSrc: ./newtarget.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="ar-video" src="./video.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" muted></video>
        <audio id="ar-audio" src="./animationaudiolatest.ogg" preload="auto" loop="true"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" delayed-play>
          
          <a-video 
            src="#ar-video" 
            width="1" height="0.5625" 
            position="0 0 0" 
            rotation="0 0 0"
            zoom-handler
          ></a-video>
          
      </a-entity>

    </a-scene>
  </body>
</html>
