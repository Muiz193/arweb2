<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AR Video Player</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      .matrix-ctrl, .prompt-msg { display: none !important; }
      
      /* BUTTON STYLE */
      .nav-button {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
        padding: 10px 20px;
        background-color: white;
        border: 2px solid #333;
        border-radius: 8px;
        font-family: sans-serif;
        font-weight: bold;
        text-decoration: none;
        color: black;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
    </style>

    <script>
      // *** 1. GESTURE DETECTOR (Zoom/Rotate) ***
      // Adapted from your code to work with Video
      AFRAME.registerComponent('gesture-detector', {
        schema: { enabled: { default: true }, sensitivity: { default: 0.5 }, zoomSpeed: { default: 0.01 } },
        init: function () {
          this.isDragging = false;
          this.startX = 0;
          this.startY = 0;
          this.startRotation = { x: 0, y: 0 };
          // For video, we start at scale 1.0 (instead of 10.0 like the 3D model)
          this.startScale = 1.0; 
          
          const targetEl = document.body;
          
          targetEl.addEventListener('mousedown', (e) => this.onStart(e));
          targetEl.addEventListener('mousemove', (e) => this.onMove(e));
          targetEl.addEventListener('mouseup', (e) => this.onEnd(e));
          targetEl.addEventListener('touchstart', (e) => this.onTouchStart(e));
          targetEl.addEventListener('touchmove', (e) => this.onTouchMove(e));
          targetEl.addEventListener('touchend', () => this.onEnd());
          
          this.el.sceneEl.addEventListener('wheel', (e) => this.onZoom(e)); 
        },
        onStart: function (event) {
          if (this.data.enabled && this.el.getAttribute('visible')) { 
            this.isDragging = true;
            this.startX = event.screenX;
            this.startY = event.screenY;
            const currentRotation = this.el.getAttribute('rotation');
            this.startRotation = { x: currentRotation.x, y: currentRotation.y };
          }
        },
        onMove: function (event) {
          if (this.isDragging && this.data.enabled) {
            const deltaX = event.screenX - this.startX;
            const deltaY = event.screenY - this.startY;
            const newRotation = {
              x: this.startRotation.x - deltaY * this.data.sensitivity, 
              y: this.startRotation.y + deltaX * this.data.sensitivity, 
            };
            this.el.setAttribute('rotation', newRotation);
          }
        },
        onTouchStart: function (event) {
          if (event.touches.length === 2) {
            this.startDistance = this.getTouchDistance(event.touches);
            this.startScale = this.el.getAttribute('scale').x;
          } else if (event.touches.length === 1) {
            this.onStart(event.touches[0]);
          }
        },
        onTouchMove: function (event) {
          if (event.touches.length === 2) {
            const newDistance = this.getTouchDistance(event.touches);
            const scaleFactor = newDistance / this.startDistance;
            // Limit video scale: Min 0.5, Max 10.0
            const newScale = Math.min(Math.max(this.startScale * scaleFactor, 0.5), 10.0); 
            this.el.setAttribute('scale', newScale + " " + newScale + " " + newScale);
          } else if (event.touches.length === 1) {
            this.onMove(event.touches[0]);
          }
        },
        onZoom: function (event) {
          const scale = this.el.getAttribute('scale').x;
          let newScale = scale + (event.deltaY * -this.data.zoomSpeed);
          newScale = Math.min(Math.max(newScale, 0.5), 10.0); 
          this.el.setAttribute('scale', newScale + " " + newScale + " " + newScale);
        },
        getTouchDistance: function (touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        },
        onEnd: function () {
          this.isDragging = false;
        },
      });
    </script>

    <script>
      // *** 2. PINNING + DELAYED AUDIO + VIDEO LOGIC ***
      AFRAME.registerComponent('pin-and-control-video', {
        init: function() {
          const targetEl = document.querySelector('#target-0');
          const videoEntity = this.el;
          
          // MEDIA ELEMENTS
          const videoElement = document.querySelector('#ar-video');
          const audioElement = document.querySelector('#ar-audio'); 

          let isPinned = false;
          let targetFound = false;
          let mediaPlayed = false;

          // CONFIGURABLE DELAY (0.2s)
          const audioDelaySeconds = 0.2;

          // Function to play media safely
          const playMediaFallback = () => {
              if (mediaPlayed) return;

              const delayMs = audioDelaySeconds * 1000;
              
              // Wait 0.2s before playing
              setTimeout(() => {
                  // Play Video
                  if(videoElement && videoElement.paused) {
                      videoElement.play().then(() => {
                          // Optional: videoElement.muted = false; 
                      }).catch(e => console.log("Video autoplay blocked"));
                  }
                  
                  // Play Audio
                  if (audioElement && audioElement.paused) {
                      audioElement.loop = true;
                      audioElement.volume = 0.5;
                      audioElement.play().then(() => {
                          mediaPlayed = true;
                          console.log(`Audio started after ${audioDelaySeconds}s delay.`);
                      }).catch(e => console.warn("Audio blocked"));
                  }
              }, delayMs);
          };
          
          const executePinning = () => {
              if (isPinned || !targetFound) return;
              isPinned = true;

              // 1. Copy Position/Rotation from Target
              const worldPos = new THREE.Vector3();
              const worldRot = new THREE.Quaternion();
              targetEl.object3D.getWorldPosition(worldPos);
              targetEl.object3D.getWorldQuaternion(worldRot);

              videoEntity.object3D.position.copy(worldPos);
              videoEntity.object3D.quaternion.copy(worldRot);

              // 2. Show Video Entity, Hide Target
              videoEntity.setAttribute('visible', true);
              targetEl.object3D.visible = false;
              
              // 3. Trigger Delayed Play
              playMediaFallback();

              // 4. Add User Interaction Fallback (Click to play)
              const fallbackListener = () => {
                  if(videoElement.paused) videoElement.play();
                  if(audioElement.paused) audioElement.play();
              };
              document.body.addEventListener('click', fallbackListener, { once: true });
              document.body.addEventListener('touchstart', fallbackListener, { once: true });
              
              console.log("Video pinned. Waiting for delay...");
          };

          targetEl.addEventListener('targetFound', () => {
              targetFound = true;
              executePinning();
          }, { once: true });
        }
      });
    </script>
  </head>
  <body>

    <a href="./index.html" class="nav-button">View 3D Model </a>

    <a-scene 
      mindar-image="imageTargetSrc: ./newtarget.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="ar-video" src="./video.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous" muted></video>
        
        <audio id="ar-audio" src="./animationaudiolatest.ogg" preload="auto" loop="true"></audio>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-0"></a-entity>
      
      <a-entity 
        id="pinned-video-entity"
        visible="false"
        gesture-detector
        pin-and-control-video
      >
        <a-video src="#ar-video" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
